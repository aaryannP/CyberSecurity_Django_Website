<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
</head>
<body>
    <div class="site-header">
        <h1 class="site-name">ThreatHuntersCell</h1>
    </div>
    <div class="glass-card">
        <h2>Forgot Password</h2>
        <p class="subtext">Enter your email to receive a password reset OTP.</p>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Email Address" value="{{ email|default:'' }}" required>
            <button type="submit">Send OTP</button>
        </form>
        <div class="links">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</body>
</html>
